# Plotting settings for the EarlyRun3 and 2024 configs.
plotting:
  era:
    Run3_2022:
      data_iso_file: data_with_pileup_January26/Run3_2022/{region}_region/{ff_process}/data_iso_{channel}_{tau_suffix}.parquet
      data_aiso_file: data_with_pileup_January26/Run3_2022/{region}_region/{ff_process}/data_aiso_{channel}_{tau_suffix}.parquet
      mc_iso_file: data_with_pileup_January26/Run3_2022/{region}_region/{ff_process}/mc_iso_{channel}_{tau_suffix}.parquet
      mc_aiso_file: data_with_pileup_January26/Run3_2022/{region}_region/{ff_process}/mc_aiso_{channel}_{tau_suffix}.parquet
    Run3_2022EE:
      data_iso_file: data_with_pileup_January26/Run3_2022EE/{region}_region/{ff_process}/data_iso_{channel}_{tau_suffix}.parquet
      data_aiso_file: data_with_pileup_January26/Run3_2022EE/{region}_region/{ff_process}/data_aiso_{channel}_{tau_suffix}.parquet
      mc_iso_file: data_with_pileup_January26/Run3_2022EE/{region}_region/{ff_process}/mc_iso_{channel}_{tau_suffix}.parquet
      mc_aiso_file: data_with_pileup_January26/Run3_2022EE/{region}_region/{ff_process}/mc_aiso_{channel}_{tau_suffix}.parquet
    Run3_2023:
      data_iso_file: data_with_pileup_January26/Run3_2023/{region}_region/{ff_process}/data_iso_{channel}_{tau_suffix}.parquet
      data_aiso_file: data_with_pileup_January26/Run3_2023/{region}_region/{ff_process}/data_aiso_{channel}_{tau_suffix}.parquet
      mc_iso_file: data_with_pileup_January26/Run3_2023/{region}_region/{ff_process}/mc_iso_{channel}_{tau_suffix}.parquet
      mc_aiso_file: data_with_pileup_January26/Run3_2023/{region}_region/{ff_process}/mc_aiso_{channel}_{tau_suffix}.parquet
    Run3_2023BPix:
      data_iso_file: data_with_pileup_January26/Run3_2023BPix/{region}_region/{ff_process}/data_iso_{channel}_{tau_suffix}.parquet
      data_aiso_file: data_with_pileup_January26/Run3_2023BPix/{region}_region/{ff_process}/data_aiso_{channel}_{tau_suffix}.parquet
      mc_iso_file: data_with_pileup_January26/Run3_2023BPix/{region}_region/{ff_process}/mc_iso_{channel}_{tau_suffix}.parquet
      mc_aiso_file: data_with_pileup_January26/Run3_2023BPix/{region}_region/{ff_process}/mc_aiso_{channel}_{tau_suffix}.parquet
  model_path: TAU-25-001/trainings/best_model_{channel}_{ff_process}.pkl
  train_test_split_path: outputs/best_models/Run3_2024_{global_str}/{channel}_{ff_process}/test_event_ids.csv
  classical_ff_path: TAU-25-001/classical/{year}_fake_factors_{channel}_{ff_process}.json
  optimal_temperature_path: TAU-25-001/trainings/temperature_scaling_results_{channel}_{ff_process}.json
  output_dir: outputs/plots/TAU-25-001_Preservation/{channel}_{ff_process}/pileup_studies
  lead_tau: &id001
  - decayMode_1
  - jpt_pt_1
  - pt_1
  - eta_1
  - phi_1
  sublead_tau: &id002
  - decayMode_2
  - jpt_pt_2
  - pt_2
  - eta_2
  - phi_2
  global_variables: &id003
  - n_jets
  - n_bjets
  features_to_plot:
  - decayMode
  - pt
  - eta
  - pt_tt
  - dR
  - n_jets
  - m_vis
  - mt_tot
  - met_pt
  - BDT_raw_score_tau
  - BDT_raw_score_higgs
  - BDT_raw_score_fake
  - pileup
  latex_names_lead:
    decayMode: $\tau_h^{lead}$ decay mode
    decayMode_other: $\tau_h^{sublead}$ decay mode
    jpt_pt: Ratio of $p_{T}^{jet}$ to $p_{T}^{\tau_h^{lead}}$
    jpt_pt_other: Ratio of $p_{T}^{jet}$ to $p_{T}^{\tau_h^{sublead}}$
    pt: $p_{T}^{\tau_h^{lead}}$ (GeV)
    pt_other: $p_{T}^{\tau_h^{sublead}}$ (GeV)
    pt_tt: $p_{T}^{\tau_h\tau_h}$ (GeV)
    eta: $\eta^{\tau_h^{lead}}$
    eta_other: $\eta^{\tau_h^{sublead}}$
    charge: $\tau_h^{lead}$ charge
    charge_other: $\tau_h^{sublead}$ charge
    phi: $\tau_h^{lead} \phi$
    phi_other: $\tau_h^{sublead} \phi$
    dR: $\Delta R(\tau_h^{lead}, \tau_h^{sublead})$
    n_jets: Number of jets
    n_bjets: Number of b-jets
    n_prebjets: Number of pre-b-jets
    m_vis: $m_{vis}$ (GeV)
    mt_tot: $m^{total}_T$ (GeV)
    FastMTT_mass: FastMTT mass (GeV)
    met_pt: MET $p_T$ (GeV)
    met_phi: MET $\phi$
    met_dphi: MET $\Delta \phi$ with $\tau_h^{lead}$
    met_dphi_other: MET $\Delta \phi$ with $\tau_h^{sublead}$
    met_var_qcd_1: $C_{\\text{QCD}} = \\frac{\\MET}{p_{T}^{\\tau_h^{lead}}}\\cos\\Delta\\phi(\\vec{\\MET},\\vec{p}_{T}^{\\tau_h^{lead}})$
    met_var_qcd_2: $C_{\\text{QCD}} = \\frac{\\MET}{p_{T}^{\\tau_h^{sublead}}}\\cos\\Delta\\phi(\\vec{\\MET},\\vec{p}_{T}^{\\tau_h^{sublead}})$
    met_var_w_1: $C_{\\text{W}} = \\frac{\\left\\lvert\\vec{\\MET}+\\vec{p}_T^{\\ell}\\right\\rvert}{p_{T}^{\\tau_h^{lead}}}\\cos\\Delta\\phi(\\vec{\\MET}+\\vec{p}_T^{\\ell},\\vec{p}_{T}^{\\tau_h^{lead}})$
    met_var_w_2: $C_{\\text{W}} = \\frac{\\left\\lvert\\vec{\\MET}+\\vec{p}_T^{\\ell}\\right\\rvert}{p_{T}^{\\tau_h^{sublead}}}\\cos\\Delta\\phi(\\vec{\\MET}+\\vec{p}_T^{\\ell},\\vec{p}_{T}^{\\tau_h^{sublead}})$
    decayModePNet: $\tau_h^{lead}$ PNet decay mode
    decayModePNet_other: $\tau_h^{sublead}$ PNet decay mode
    BDT_raw_score_tau: $\tau_h$ BDT score
    BDT_raw_score_higgs: Higgs BDT score
    BDT_raw_score_fake: Misidentified $\tau_h$ BDT score
    pileup: $\langle \mu \rangle$
  latex_names_sublead:
    decayMode: $\tau_h$ decay mode
    jpt_pt: Ratio of $p_{T}^{jet}$ to $p_{T}^{\tau_h}$
    pt: $p_{T}^{\tau_h}$ (GeV)
    pt_tt: $p_{T}^{\tau_h\tau_h}$ (GeV)
    eta: $\eta^{\tau_h}$
    charge: $\tau_h$ charge
    phi: $\tau_h \phi$
    dR: $\Delta R(\ell, \tau_h)$
    n_jets: Number of jets
    n_bjets: Number of b-jets
    n_prebjets: Number of pre-b-jets
    m_vis: $m_{vis}$ (GeV)
    mt_tot: $m^{total}_T$ (GeV)
    FastMTT_mass: FastMTT mass (GeV)
    met_pt: MET $p_T$ (GeV)
    met_phi: MET $\phi$
    met_dphi: MET $\Delta \phi$ with $\tau_h$
    met_var_qcd_1: $C_{\\text{QCD}} = \\frac{\\MET}{p_{T}^{\\tau_h}}\\cos\\Delta\\phi(\\vec{\\MET},\\vec{p}_{T}^{\\tau_h})$
    met_var_w_1: $C_{\\text{W}} = \\frac{\\left\\lvert\\vec{\\MET}+\\vec{p}_T^{\\ell}\\right\\rvert}{p_{T}^{\\tau_h}}\\cos\\Delta\\phi(\\vec{\\MET}+\\vec{p}_T^{\\ell},\\vec{p}_{T}^{\\tau_h})$
    decayModePNet: $\tau_h^{lead}$ PNet decay mode
    BDT_raw_score_tau: $\tau_h$ BDT score
    BDT_raw_score_higgs: Higgs BDT score
    BDT_raw_score_fake: Misidentified $\tau_h$ BDT score
    pileup: $\langle \mu \rangle$
