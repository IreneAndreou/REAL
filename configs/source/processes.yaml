      et_baseline: (os == 1) & (iso_1 < 0.15) & (idDeepTau2018v2p5VSe_2 >= 6) & (idDeepTau2018v2p5VSmu_2
        >= 4) & (((trg_singleelectron) & (pt_1 > 31) & (abs(eta_1) < 2.1)))
